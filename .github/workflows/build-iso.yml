
name: build-iso

on:
  workflow_dispatch:
  push:
    paths:
      - "kali-config/**"
      - ".github/workflows/build-iso.yml"
      - "build.sh"
      - "check-packages.sh"

permissions:
  contents: read

concurrency:
  group: nullsec-iso-build
  cancel-in-progress: false

jobs:
  iso:
    name: Build NullSec ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate configuration and fix permissions
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="kali-config/variant-nullsec"

          if [[ ! -d "$CONFIG" ]]; then
            echo "::error::Configuration directory not found: $CONFIG"
            echo "Repository directories:"
            find . -maxdepth 4 -type d | sort | head -200
            exit 1
          fi

          echo "Found NullSec configuration: $CONFIG"
          echo "Configuration files:"
          find "$CONFIG" -type f | sort

          # Make NullSec command scripts executable.
          find "$CONFIG" -type f \
            \( -name "ns" \
            -o -name "ns-genmenu" \
            -o -name "ns-menu" \
            -o -name "ns-pack" \
            -o -name "ns-power" \) \
            -exec chmod +x {} +

          # Make custom live-build hooks executable.
          find "$CONFIG" -type f \
            \( -name "*.chroot" -o -name "*.hook.chroot" \) \
            -exec chmod +x {} +

          echo "Permission preparation completed."

      - name: Build NullSec ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          docker pull kalilinux/kali-rolling

          docker run \
            --rm \
            --privileged \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            kalilinux/kali-rolling \
            bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "========================================"
              echo "Installing live-build dependencies"
              echo "========================================"

              apt-get update

              apt-get install -y --no-install-recommends \
                ca-certificates \
                git \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                rsync \
                cpio \
                dosfstools \
                mtools \
                curl \
                wget \
                gpg

              echo "========================================"
              echo "Preparing Kali live-build configuration"
              echo "========================================"

              rm -rf /lbc

              git clone --depth 1 \
                https://gitlab.com/kalilinux/build-scripts/live-build-config.git \
                /lbc

              if [[ ! -f /lbc/build.sh ]]; then
                echo "ERROR: Kali live-build build.sh not found."
                exit 1
              fi

              if [[ ! -d /src/kali-config/variant-nullsec ]]; then
                echo "ERROR: NullSec configuration is missing."
                exit 1
              fi

              mkdir -p /lbc/kali-config

              rm -rf /lbc/kali-config/variant-nullsec

              cp -a \
                /src/kali-config/variant-nullsec \
                /lbc/kali-config/variant-nullsec

              cd /lbc

              chmod +x ./build.sh

              echo "========================================"
              echo "NullSec configuration and hooks"
              echo "========================================"

              find kali-config/variant-nullsec -type f | sort

              echo "========================================"
              echo "Starting NullSec ISO build"
              echo "========================================"

              ./build.sh --variant nullsec

              echo "========================================"
              echo "Collecting build artifacts"
              echo "========================================"

              # Kali live-build writes generated artifacts to output/,
              # not to an images/ directory.
              if [[ ! -d /lbc/output ]]; then
                echo "ERROR: Build output directory /lbc/output was not created."
                echo "Available build directories:"
                find /lbc -maxdepth 2 -type d | sort | head -200
                exit 1
              fi

              echo "Contents of /lbc/output:"
              ls -lah /lbc/output

              # Copy the ISO, build log, and checksum when available.
              find /lbc/output -maxdepth 1 -type f \
                \( -name "*.iso" \
                -o -name "*.iso.log" \
                -o -name "*.iso.sha512sum" \
                -o -name "*.sha512sum" \) \
                -exec cp -v {} /src/out/ \;

              # The ISO is required for a successful build.
              if ! find /src/out -maxdepth 1 -type f \
                -name "*.iso" -print -quit | grep -q .; then
                echo "ERROR: ISO was not copied to /src/out."
                echo "Build output directory contents:"
                ls -lah /lbc/output
                exit 1
              fi

              echo "========================================"
              echo "ISO build completed successfully"
              echo "========================================"

              ls -lh /src/out/

              # Generate a checksum if Kali did not provide one.
              ISO_PATH="$(find /src/out -maxdepth 1 -type f \
                -name "*.iso" -print -quit)"

              if ! find /src/out -maxdepth 1 -type f \
                \( -name "*.iso.sha512sum" -o -name "*.sha512sum" \) \
                -print -quit | grep -q .; then
                (
                  cd /src/out
                  sha512sum "$(basename "$ISO_PATH")" \
                    > "$(basename "$ISO_PATH").sha512sum"
                )
              fi

              echo "Final artifact files:"
              ls -lh /src/out/
            '

      - name: Verify ISO artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated ISO..."

          ISO_COUNT="$(find out -maxdepth 1 -type f -name "*.iso" | wc -l)"

          if [[ "$ISO_COUNT" -lt 1 ]]; then
            echo "::error::No ISO found in out/."
            ls -lah out/
            exit 1
          fi

          echo "Generated ISO:"
          ls -lh out/*.iso

          echo "Available checksums and logs:"
          find out -maxdepth 1 -type f \
            \( -name "*.sha512sum" -o -name "*.iso.log" \) \
            -print

          echo "Artifact verification passed."

      - name: Upload NullSec ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-iso
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
