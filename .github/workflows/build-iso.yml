name: build-iso

on:
  workflow_dispatch:
  push:
    paths:
      - "kali-config/**"
      - ".github/workflows/build-iso.yml"
      - "build.sh"
      - "check-packages.sh"

permissions:
  contents: read

concurrency:
  group: nullsec-iso-build
  cancel-in-progress: false

jobs:
  iso:
    name: Build NullSec ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate configuration and fix permissions
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="kali-config/variant-nullsec"

          if [[ ! -d "$CONFIG" ]]; then
            echo "::error::Configuration directory not found: $CONFIG"
            echo "Repository contents:"
            find . -maxdepth 4 -type d | sort | head -200
            exit 1
          fi

          echo "Found NullSec configuration: $CONFIG"

          echo "Configuration files:"
          find "$CONFIG" -type f | sort

          # Fix executable permissions for NullSec command scripts.
          find "$CONFIG" -type f \
            \( -name "ns" \
            -o -name "ns-genmenu" \
            -o -name "ns-menu" \
            -o -name "ns-pack" \
            -o -name "ns-power" \) \
            -exec chmod +x {} +

          # Find hooks wherever they actually reside.
          # Do not fail just because a guessed path does not exist.
          find "$CONFIG" -type f \
            \( -name "*.chroot" -o -name "*.hook.chroot" \) \
            -exec chmod +x {} +

          echo "Permission preparation completed."

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          docker pull kalilinux/kali-rolling

          docker run \
            --rm \
            --privileged \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            kalilinux/kali-rolling \
            bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y --no-install-recommends \
                ca-certificates \
                git \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                rsync \
                cpio \
                dosfstools \
                mtools \
                curl \
                wget \
                gpg

              rm -rf /lbc

              git clone --depth 1 \
                https://gitlab.com/kalilinux/build-scripts/live-build-config.git \
                /lbc

              if [[ ! -f /lbc/build.sh ]]; then
                echo "ERROR: Kali live-build build.sh not found."
                exit 1
              fi

              mkdir -p /lbc/kali-config

              rm -rf /lbc/kali-config/variant-nullsec

              cp -a \
                /src/kali-config/variant-nullsec \
                /lbc/kali-config/variant-nullsec

              cd /lbc

              chmod +x ./build.sh

              # Display actual hook locations for debugging.
              echo "NullSec hooks installed in build configuration:"
              find kali-config/variant-nullsec -type f \
                \( -name "*.chroot" -o -name "*.hook.chroot" \) \
                -print

              ./build.sh --variant nullsec

              mkdir -p /src/out

              find images -maxdepth 1 -type f -name "*.iso" \
                -exec cp -v {} /src/out/ \;

              if ! find /src/out -maxdepth 1 -type f -name "*.iso" \
                -print -quit | grep -q .; then
                echo "ERROR: No ISO was generated."
                exit 1
              fi

              echo "ISO generated successfully:"
              ls -lh /src/out/*.iso
            '

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-iso
          path: out/*.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
