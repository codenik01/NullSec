name: build-iso
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions: { contents: write }
jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true; df -h /
      - name: build natively in kali
        run: |
          docker run --privileged --rm -v "$PWD":/src -w /src kalilinux/kali-rolling \
            bash -c 'apt-get update && apt-get install -y git sudo && ./build.sh ${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with: { name: nullsec-${{ matrix.arch }}, path: out/*.iso, compression-level: 0 }
      - name: attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: out/*.iso }
