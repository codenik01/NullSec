name: build-iso

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - name: make scripts executable
        run: chmod +x build-iso.sh overlay/usr/local/bin/*

      - name: build
        run: sudo bash ./build-iso.sh ${{ matrix.arch }}

      - name: upload iso
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-${{ matrix.arch }}
          path: out/*.iso
          compression-level: 0

      - name: release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
