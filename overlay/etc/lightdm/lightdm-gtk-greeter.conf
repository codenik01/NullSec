[greeter]
# your wallpaper behind a translucent login card; the NullOS mark is the default avatar
background=/usr/share/backgrounds/nullos/red.jpg
theme-name=NullOS-Login
icon-theme-name=Adwaita
cursor-theme-name=Adwaita
font-name=JetBrains Mono 11
default-user-image=/usr/share/icons/hicolor/256x256/apps/nullos.png
clock-format=%a %d %b   %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
position=50%,center 80%,center
user-background=false
hide-user-image=true
screensaver-timeout=60
