# conservative: works without GPU/GL (VMs). fade + dim unfocused. turn off with: ns-fx off
backend = "xrender";
vsync = false;
shadow = false;
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;
inactive-opacity = 0.93;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
