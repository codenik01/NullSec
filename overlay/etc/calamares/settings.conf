# NullOS installer (Calamares). Validated against Calamares' own module schemas by tests/installer_test.py.
# Offline by design: the system is copied from the live image, and the bootloader packages are already inside it.
---
modules-search: [ local ]

instances:
- id:       prepare
  module:   shellprocess
  config:   shellprocess_prepare.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@prepare
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: nullos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
