---
# Runs on the live system against the freshly copied target (${ROOT}) before the initramfs and bootloader are built.
# Every command is written so that it cannot fail the installation over a cosmetic step.
dontChroot: true
timeout: 60
script:
    # the live session auto-logs in as the casper user 'ns'; the installed system has no such user
    - command: "sed -i '/^autologin-user/d' ${ROOT}/etc/lightdm/lightdm.conf.d/99-nullsec.conf || true"
    # the kernel is already in the image; make sure a copy exists under the name grub looks for
    - command: "[ -e ${ROOT}/boot/vmlinuz-$(uname -r) ] || cp /cdrom/casper/vmlinuz ${ROOT}/boot/vmlinuz-$(uname -r) || true"
    # fresh security-service state and log for the new system (live-session history must not be carried over)
    - command: "rm -rf ${ROOT}/var/lib/nullos ${ROOT}/var/log/nullos ${ROOT}/run/nullos || true"
    # a live-session boot flag must not exist on the installed system
    - command: "rm -f ${ROOT}/etc/nullos-live || true"
    # the live sudoers rule names the live user 'ns'; on the installed system it must apply to whoever the admin account is
    - command: "sed -i 's/^ns ALL=/%sudo ALL=/' ${ROOT}/etc/sudoers.d/90-nullos-session || true"
