---
# Runs INSIDE the new system right after GRUB is installed: removes the firmware's stale entry for the installer ISO/USB
# (the "BdsDxe: failed to load Boot0001 ... Not Found" message), puts NullOS first in the boot order and checks grub.cfg.
# It can never fail the installation.
dontChroot: false
timeout: 60
script:
    - command: "/usr/local/bin/ns-bootfix --post-install || true"
