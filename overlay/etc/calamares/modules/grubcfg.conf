---
overwrite: false
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TIMEOUT_STYLE: menu
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_THEME: "/boot/grub/themes/nullos/theme.txt"
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_TERMINAL_OUTPUT: "gfxterm"
kernel_params: [ "quiet" ]
always_use_defaults: false
