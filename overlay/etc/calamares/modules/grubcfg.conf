---
overwrite: false
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TIMEOUT_STYLE: menu
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    # Plain text console menu: the themed gfxterm menu is a suspected cause of the boot stalling on the firmware logo in UEFI VMs (UTM/QEMU arm64) after
    # shim started. The theme files are still copied to /boot/grub/themes/nullos; re-enable with GRUB_THEME + GRUB_TERMINAL_OUTPUT=gfxterm.
    GRUB_TERMINAL_OUTPUT: "console"
kernel_params: [ "loglevel=3" ]
always_use_defaults: false
