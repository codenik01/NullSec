---
# Only groups that exist in the NullOS image (a missing group would fail user creation).
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - audio
    - video
    - sudo
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
    shell: /bin/bash
    forbidden_names: [ root, ns ]
allowWeakPasswords: true
allowWeakPasswordsDefault: false
